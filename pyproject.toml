[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtuoso-transcribe"
version = "0.1.0"
description = "Melody-preserving, role-aware piano transcription research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["music21>=9.7,<10", "PyYAML>=6,<7", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
model = ["torch>=2.3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "model", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
virtuoso-transcribe = "src.inference.generate:main"
virtuoso-prepare = "scripts.prepare_dataset:main"
virtuoso-evaluate = "scripts.evaluate_all:main"
virtuoso-train = "scripts.train_model:main"
virtuoso-demo = "scripts.run_demo:main"
virtuoso-experiments = "scripts.run_experiments:main"
virtuoso-human-evaluation = "scripts.human_evaluation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
"src.demo" = ["*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
